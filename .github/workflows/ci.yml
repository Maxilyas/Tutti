name: Vérifications

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verifications-${{ github.ref }}
  cancel-in-progress: true

jobs:
  moteur:
    name: Code, tests du moteur et construction
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérification du code
        run: npm run check
      - name: Tests du moteur de jeu
        run: npm test
      - name: Construction
        run: npm run build

  bout-en-bout:
    name: Parties complètes dans un vrai navigateur
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installation du navigateur
        run: npx playwright install --with-deps chromium
      - name: Tests de bout en bout
        run: npm run test:e2e
      - name: Conservation des traces en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-des-tests
          path: test-results/
          retention-days: 7
